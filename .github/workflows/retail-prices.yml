name: Refresh verified retail prices
on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/retail-parser.mjs
      - run: node scripts/update-retail-prices.mjs
      - name: Publish refreshed price feed
        run: |
          if ! git diff --quiet -- retail-prices.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add retail-prices.json
            git commit -m 'Refresh verified retail prices'
            git push
          fi
