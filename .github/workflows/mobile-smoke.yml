name: Mobile smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-smoke.yml'
      - 'index.html'
      - '*.js'
      - 'manifest.webmanifest'
  workflow_dispatch:

jobs:
  mobile-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static JavaScript and PWA checks
        run: |
          node <<'NODE'
          const fs = require('fs');

          const jsFiles = fs.readdirSync('.').filter(f => f.endsWith('.js'));
          for (const file of jsFiles) {
            const src = fs.readFileSync(file, 'utf8');
            new Function(src);
          }

          const html = fs.readFileSync('index.html', 'utf8');
          const inline = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)].map(m => m[1]);
          if (!inline.length) throw new Error('Ingen inline-JavaScript hittades i index.html');
          inline.forEach(src => new Function(src));

          const sw = fs.readFileSync('sw.js', 'utf8');
          const cache = sw.match(/const CACHE\s*=\s*['"]([^'"]+)['"]/);
          if (!cache) throw new Error('Service worker saknar CACHE-version');
          const filesBlock = sw.match(/const FILES\s*=\s*\[([\s\S]*?)\];/);
          if (!filesBlock) throw new Error('Service worker saknar FILES-lista');
          const refs = [...filesBlock[1].matchAll(/['"]\.\/([^'"]+)['"]/g)].map(m => m[1]).filter(Boolean);
          for (const ref of refs) {
            if (!fs.existsSync(ref)) throw new Error('Service worker refererar till fil som saknas: ' + ref);
          }

          const required = [
            "function draftUsesCustomerAddress()",
            "siteUsesCustomerAddress: draftUsesCustomerAddress()",
            "if(a==='search-material-mention')",
            "if(a==='dismiss-material-mention')"
          ];
          for (const s of required) if (!html.includes(s)) throw new Error('Regression-skydd saknas: ' + s);

          const backup = fs.readFileSync('backup-v64.js','utf8');
          if (!backup.includes("'checklist'") || !backup.includes("'radar'") || backup.includes("'checklists'")) throw new Error('Backupens store-lista är fel');
          if (!backup.includes("SECRET_STORAGE_KEYS") || !backup.includes("lirogo_ai_key")) throw new Error('Backupen skyddar inte AI-nyckeln');

          const noDemo = fs.readFileSync('no-demo-v62.js','utf8');
          if (!noDemo.includes("dbDel('jobs'") || noDemo.includes('dbDelete(')) throw new Error('Demo-städningen använder fel databasfunktion');
          if (html.includes('await seedDemoIfEmpty();')) throw new Error('Kärnappen seedar fortfarande demodata');

          const home = fs.readFileSync('home-v44.js','utf8');
          const be = fs.readFileSync('break-even-v57.js','utf8');
          if (!home.includes('statsDirtyV44')) throw new Error('Startsidan saknar invalidation av materialstatistik');
          if (!be.includes('materialsDirtyV57')) throw new Error('Break-even saknar invalidation efter materialändring');

          const customerReport = fs.readFileSync('customer-report-v58.js','utf8');
          if (!customerReport.includes('measurementsV66') || !customerReport.includes('MÄTVÄRDEN')) throw new Error('Kundrapporten saknar mätvärden');

          if (!home.includes('todayExternalV89') || !home.includes('Outlook') || !home.includes('maybeSyncCalendarV89')) throw new Error('Startsidan saknar Outlook-agenda');
          if (!html.includes("prop==='DTEND'") || !html.includes("end: e.dtend?.date")) throw new Error('ICS-sluttid parsas inte');
          if (!html.includes('LIRO_ICAL_PROXY_URL') || !html.includes("method:'POST'") || !html.includes('outlook-calendar-proxy')) throw new Error('Kalendersynk använder inte LiRo-proxyn');
          const desktop = fs.readFileSync('desktop-v92.js','utf8');
          if (!desktop.includes('liro-desktop-home') || !desktop.includes('@media (min-width:900px)')) throw new Error('Desktop-layouten saknas');
          const nav = fs.readFileSync('nav-v56.js','utf8');
          if (!nav.includes("if(act==='nav-home')") || !nav.includes("st={view:'home'}")) throw new Error('Hem-knappen stänger inte paneler direkt');
          if (!html.includes('function currentIcalEvents') || !html.includes("range:'today+180d'")) throw new Error('Kalendern filtrerar inte bort gamla Outlook-händelser');

          // v78: tilläggslagren ska laddas direkt av index.html, inte bara via service workern.
          const layers = [...sw.matchAll(/'\.\/([a-z0-9-]+-v\d+\.js)'/g)].map(m => m[1]);
          for (const l of layers) if (!html.includes(`src="./${l}"`)) throw new Error('index.html laddar inte lagret ' + l);
          if (sw.includes('injectHomeOverlay')) throw new Error('sw.js injicerar fortfarande skript');
          if (!refs.includes('zxing_reader.wasm') || !refs.includes('barcode-polyfill.js')) throw new Error('Streckkodsläsaren är inte offline-cachad');
          if (fs.readFileSync('barcode-polyfill.js','utf8').includes('jsdelivr')) throw new Error('Streckkodsläsaren hämtar fortfarande från CDN');
          if (!html.includes('async function shrinkPhoto(')) throw new Error('Fotokrympning saknas');

          console.log(JSON.stringify({ ok:true, jsFiles:jsFiles.length, inlineScripts:inline.length, cache:cache[1], precacheFiles:refs.length }, null, 2));
          NODE

      - name: Install Playwright and static server
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest http-server@latest
          npx playwright install --with-deps webkit

      - name: Run iPhone-like WebKit regression flow
        run: |
          npx http-server . -p 4173 -c-1 >/tmp/liro-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done

          node <<'NODE'
          const { webkit, devices } = require('playwright');
          (async() => {
            const browser = await webkit.launch();
            const url = 'http://127.0.0.1:4173/';

            // 1) Testa den riktiga installerade/PWA-liknande appen med service worker och tilläggslagren.
            const pwaContext = await browser.newContext({ ...devices['iPhone 15 Pro'] });
            const pwa = await pwaContext.newPage();
            const pwaErrors = [];
            pwa.on('pageerror', e => pwaErrors.push('pageerror: ' + e.message));
            pwa.on('console', m => { if (m.type() === 'error') pwaErrors.push('console: ' + m.text()); });

            const response = await pwa.goto(url, { waitUntil:'networkidle', timeout:45000 });
            if (!response || !response.ok()) throw new Error('Appen svarade inte OK');

            await pwa.evaluate(async () => {
              if ('serviceWorker' in navigator) await navigator.serviceWorker.ready;
            });
            await pwa.reload({ waitUntil:'networkidle', timeout:45000 });
            await pwa.locator('[data-act="new-job"]').first().waitFor({ state:'visible', timeout:10000 });

            const body = await pwa.locator('body').innerText();
            for (const act of ['nav-home','nav-projects','open-radar','open-settings']) {
              if (await pwa.locator(`.bottomnav [data-act="${act}"]`).count() !== 1) {
                throw new Error('Bottenmeny saknar action ' + act);
              }
            }
            if (!body.includes('Materialvinst')) throw new Error('Smarta startsidan laddades inte');
            if (await pwa.locator('[data-act="open-stats-v44"]').count() < 1) throw new Error('Statistikknappen hittades inte');

            const swState = await pwa.evaluate(async () => {
              const reg = await navigator.serviceWorker.getRegistration();
              const cacheKeys = await caches.keys();
              const swText = await (await fetch('./sw.js', { cache:'no-store' })).text();
              const m = swText.match(/const CACHE\s*=\s*['"]([^'"]+)['"]/);
              return { active:!!reg?.active, cacheKeys, expected:m?.[1] || null };
            });
            if (!swState.active) throw new Error('Service worker blev inte aktiv');
            if (!swState.expected || !swState.cacheKeys.includes(swState.expected)) {
              throw new Error('Aktuell PWA-cache saknas: ' + JSON.stringify(swState));
            }

            const criticalPwaErrors = pwaErrors.filter(e => !e.includes('favicon'));
            if (criticalPwaErrors.length) throw new Error('PWA JavaScript-fel: ' + criticalPwaErrors.join(' | '));
            await pwaContext.close();

            // 2) Testa kärnflödet utan service worker. Det isolerar formulär/business logic
            // från startsidans asynkrona widget-renderingar och testar samma WebKit-motor som iPhone.
            const coreContext = await browser.newContext({ ...devices['iPhone 15 Pro'], serviceWorkers:'block' });
            const page = await coreContext.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push('pageerror: ' + e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push('console: ' + m.text()); });

            const coreResponse = await page.goto(url, { waitUntil:'networkidle', timeout:45000 });
            if (!coreResponse || !coreResponse.ok()) throw new Error('Kärnappen svarade inte OK');
            await page.waitForFunction(() => typeof emptyDraft === 'function' && typeof render === 'function', null, { timeout:10000 });

            await page.evaluate(() => {
              draft = emptyDraft();
              searchQuery = '';
              st = { view:'wizard', step:1 };
              render();
            });
            await page.locator('[data-field="nc.name"]').waitFor({ state:'visible', timeout:5000 });

            // Ny kund ska kunna fortsätta utan kundadress.
            await page.locator('[data-field="nc.name"]').fill('Smoke Test Kund');
            await page.locator('[data-field="nc.phone"]').fill('0701234567');
            const formattedPhone = await page.locator('[data-field="nc.phone"]').inputValue();
            if (formattedPhone !== '070-123 45 67') throw new Error('Telefon formaterades inte: ' + formattedPhone);

            const saveAsContact = page.locator('[data-act="toggle-save-contact"]');
            if ((await saveAsContact.getAttribute('class') || '').includes(' on')) {
              throw new Error('Spara som kontakt ska vara av som standard');
            }

            const customerNext = page.locator('.wiz-footer [data-act="wiz-next"]');
            if (await customerNext.isDisabled()) throw new Error('Kundsteget kräver fortfarande adress');
            await customerNext.click();

            // Utan kundadress måste arbetsplats anges.
            await page.locator('[data-field="ws.address"]').waitFor({ state:'visible', timeout:5000 });
            const workNext = page.locator('.wiz-footer [data-act="wiz-next"]');
            if (!(await workNext.isDisabled())) throw new Error('Arbetsplatsadress krävs inte trots saknad kundadress');
            const sameAddressSwitch = page.locator('[data-act="toggle-use-customer-address"]');
            if (!(await sameAddressSwitch.isDisabled())) throw new Error('Samma kundadress går att välja trots att kundadress saknas');

            await page.locator('[data-field="ws.address"]').fill('Testgatan 1');
            await page.locator('[data-field="ws.postalCode"]').fill('25220');
            await page.locator('[data-field="ws.city"]').fill('Helsingborg');
            const wsPost = await page.locator('[data-field="ws.postalCode"]').inputValue();
            if (wsPost !== '252 20') throw new Error('Arbetsplatsens postnummer formaterades inte: ' + wsPost);
            if (await workNext.isDisabled()) throw new Error('Arbetsplatssteget låstes inte upp efter adress');
            await workNext.click();

            await page.locator('[data-field="title"]').fill('Smoke Test Uppdrag');
            await page.locator('.wiz-footer [data-act="wiz-next"]').click();

            const summary = await page.locator('body').innerText();
            if (!summary.includes('Testgatan 1')) throw new Error('Arbetsplatsadressen saknas i sammanfattningen');
            await page.locator('[data-act="wiz-submit"]').click();
            await page.waitForFunction(() => st.view === 'job', null, { timeout:5000 });
            await page.getByText('Smoke Test Uppdrag', { exact:true }).first().waitFor({ state:'visible', timeout:5000 });

            const saved = await page.evaluate(() => {
              const j = jobs.find(x => x.title === 'Smoke Test Uppdrag');
              const cust = j ? customers.find(x => x.id === j.customerId) : null;
              return j ? {
                siteUsesCustomerAddress:j.siteUsesCustomerAddress,
                siteAddress:j.siteAddress,
                sitePostalCode:j.sitePostalCode,
                customerAddress:cust?.address || null,
                saveAsContact:cust?.saveAsContact
              } : null;
            });
            if (!saved) throw new Error('Testuppdraget sparades inte');
            if (saved.siteUsesCustomerAddress !== false) throw new Error('Fel arbetsplatsläge sparades: ' + JSON.stringify(saved));
            if (saved.siteAddress !== 'Testgatan 1') throw new Error('Fel arbetsplatsadress sparades: ' + JSON.stringify(saved));
            if (saved.sitePostalCode !== '252 20') throw new Error('Fel postnummer sparades: ' + JSON.stringify(saved));
            if (saved.customerAddress !== null) throw new Error('Tom kundadress sparades fel: ' + JSON.stringify(saved));
            if (saved.saveAsContact !== false) throw new Error('Spara som kontakt blev felaktigt aktivt: ' + JSON.stringify(saved));

            // Materialförslagets knappar ska fungera oberoende av Registrera material-panelen.
            await page.evaluate(async () => {
              const j = jobs.find(x => x.title === 'Smoke Test Uppdrag');
              j.materialMentions = [{ name:'Testkabel', qty:1, unit:'st' }];
              await dbPut('jobs', j);
              st.jobTab = 'material';
              render();
            });
            const dismiss = page.locator('[data-act="dismiss-material-mention"]').first();
            await dismiss.waitFor({ state:'visible', timeout:5000 });
            await dismiss.click();
            await page.waitForFunction(() => !document.querySelector('[data-act="dismiss-material-mention"]'), null, { timeout:5000 }).catch(() => {});
            if (await page.locator('[data-act="dismiss-material-mention"]').count()) {
              throw new Error('Materialförslaget gick inte att ta bort');
            }

            // v78: ordsökning i valfri ordning i prislistan.
            const search = await page.evaluate(async () => {
              await ensureCatalog();
              return { a: searchCatalog('jordat uttag', 5).length, b: searchCatalog('uttag jordat', 5).length };
            });
            if (!search.a || search.a !== search.b) throw new Error('Ordsökning i prislistan fungerar inte: ' + JSON.stringify(search));

            // v89: Outlook-händelser ska synas på startsidans Idag-lista tillsammans med LiRo-jobb.
            await page.evaluate(() => {
              externalEvents = [{
                title:'Smoke Outlook Möte',
                start:new Date(new Date().setHours(14,0,0,0)).toISOString(),
                end:new Date(new Date().setHours(15,0,0,0)).toISOString(),
                allDay:false,
                location:'Smoke-rum'
              }];
              st={view:'home'};
              render();
            });
            const homeText = await page.locator('body').innerText();
            if (!homeText.includes('Smoke Outlook Möte') || !homeText.includes('Outlook') || !homeText.includes('14:00 – 15:00')) {
              throw new Error('Outlook-händelse visas inte korrekt på startsidan: ' + homeText.slice(0,1200));
            }

            const parsedIcs = await page.evaluate(() => parseICS('BEGIN:VCALENDAR\nBEGIN:VEVENT\nSUMMARY:Test\nDTSTART:20260929T140000\nDTEND:20260929T150000\nEND:VEVENT\nEND:VCALENDAR'));
            if (!parsedIcs[0]?.end) throw new Error('ICS DTEND saknas efter parsing');


            // v92: Hem i bottenmenyn ska stänga Inställningar direkt.
            await page.evaluate(() => {
              st={view:'home'};
              settingsOpen=true;
              st.settingsTab='calendar';
              render();
            });
            await page.locator('.bottomnav [data-act="nav-home"]').click();
            const homeState = await page.evaluate(() => ({view:st.view,settingsOpen,calendarOpen,tab:st.settingsTab||null}));
            if (homeState.view!=='home' || homeState.settingsOpen || homeState.calendarOpen || homeState.tab) {
              throw new Error('Hem stängde inte paneler direkt: '+JSON.stringify(homeState));
            }

            // v92: bred desktop ska få tvåkolumns dashboard.
            await page.setViewportSize({width:1440,height:1000});
            await page.evaluate(() => { st={view:'home'}; settingsOpen=false; calendarOpen=false; render(); });
            const desktopState = await page.evaluate(() => ({
              desktopHome:document.body.classList.contains('liro-desktop-home'),
              display:getComputedStyle(document.getElementById('app')).display,
              columns:getComputedStyle(document.getElementById('app')).gridTemplateColumns
            }));
            if (!desktopState.desktopHome || desktopState.display!=='grid' || !desktopState.columns.includes(' ')) {
              throw new Error('Desktop-dashboard aktiverades inte: '+JSON.stringify(desktopState));
            }

            const criticalErrors = errors.filter(e => !e.includes('favicon') && !e.includes('Service Worker'));
            if (criticalErrors.length) throw new Error('Kärnapp JavaScript-fel: ' + criticalErrors.join(' | '));

            console.log(JSON.stringify({
              ok:true,
              pwa:{ viewport:pwa.viewportSize(), swState, errors:criticalPwaErrors },
              core:{ viewport:page.viewportSize(), saved, errors:criticalErrors }
            }, null, 2));

            await coreContext.close();
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
