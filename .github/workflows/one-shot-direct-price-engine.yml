name: One-shot direct price engine fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-direct-price-engine.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch direct price engine loading
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./price-engine-v105.js"></script>'
          old='<script src="./desktop-v92.js"></script>\\n<script src="./quickflow-v103.js"></script>'
          new='<script src="./desktop-v92.js"></script>\\n'+tag+'\\n<script src="./quickflow-v103.js"></script>'
          if tag not in s:
              if old not in s:
                  raise SystemExit('Could not find index script tail')
              s=s.replace(old,new,1)
              p.write_text(s)

          p=Path('quickflow-v103.js')
          s=p.read_text()
          start=s.find('/* LiRo GO v115 – enda prislagret.')
          if start!=-1:
              s=s[:start].rstrip()+"\n"
              p.write_text(s)

          p=Path('sw.js')
          s=p.read_text().replace("const CACHE = 'lirogo-v123';","const CACHE = 'lirogo-v124';")
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html quickflow-v103.js sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Load Ahlsell price engine directly"
          git push origin main
