name: Material price regression

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'price-engine-v105.js'
      - 'quickflow-v103.js'
      - 'barcode-v96.js'
      - 'sw.js'
      - '.github/workflows/price-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'price-engine-v105.js'
      - 'quickflow-v103.js'
      - 'barcode-v96.js'
      - 'sw.js'
      - '.github/workflows/price-regression.yml'
  workflow_dispatch:

jobs:
  price-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Ahlsell price calculation and barcode normalization
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const store={};
          global.window=global;
          global.localStorage={
            getItem:k=>Object.prototype.hasOwnProperty.call(store,k)?store[k]:null,
            setItem:(k,v)=>{store[k]=String(v)}
          };
          global.document={addEventListener(){},querySelector(){return null}};
          global.setTimeout=()=>{};
          global.alert=()=>{};
          global.render=()=>true;
          global.indexedDB=undefined;
          vm.runInThisContext(fs.readFileSync('price-engine-v105.js','utf8'));

          if(!global.LiRoPrice || LiRoPrice.version!==117) throw new Error('Prisengine är inte v117');
          if(LiRoPrice.source!=='ahlsell-files-only') throw new Error('Prisengine är inte låst till Ahlsell-filerna');
          if(LiRoPrice.normalizeArt('220')!=='0000220') throw new Error('E-nummer utan inledande nollor normaliseras inte');
          if(LiRoPrice.normalizeArt('E 00 002 20')!=='0000220') throw new Error('Formaterat E-nummer normaliseras inte');
          if(LiRoPrice.normalizeArt('603023E')!=='0603023E') throw new Error('E-suffix med saknad inledande nolla normaliseras inte');

          const agreementLine=({art='',cls='',discount=0,specific=0,net=0,chain=0}) =>
            '  '+'N'+'0000000'+String(art).padEnd(20,' ')+String(cls).padEnd(6,' ')+
            String(discount).padStart(4,'0')+String(specific).padStart(4,'0')+
            String(net).padStart(9,'0')+String(chain).padStart(4,'0')+' '.repeat(30)+'261231';
          const baseLine=({art,gnp,cls}) =>
            String(art).padEnd(20,' ')+String(gnp).padStart(12,'0')+String(cls).padEnd(6,' ')+'ST '+' TEST';

          const agreement=[
            agreementLine({cls:'QL0700',discount:649}),
            agreementLine({cls:'QA5952',discount:770}),
            agreementLine({cls:'QA0901',discount:686}),
            agreementLine({cls:'QA0100',discount:500}),
            agreementLine({art:'9999999',net:1234})
          ].join('\n');
          const base=[
            baseLine({art:'2044120',gnp:12200,cls:'QL0700'}),
            baseLine({art:'0445707',gnp:9750,cls:'QA5952'}),
            baseLine({art:'0030960',gnp:9250,cls:'QA0901'}),
            baseLine({art:'0000220',gnp:19800,cls:'QA0100'}),
            baseLine({art:'9999999',gnp:99999,cls:'QL0700'}),
            baseLine({art:'8888888',gnp:4567,cls:'NOPE00'}),
            baseLine({art:'0602020',gnp:0,cls:'QB991A'})
          ].join('\n');

          const parsed=LiRoPrice.parseAgreement(agreement);
          const result=LiRoPrice.calculateFromBase(base,parsed);
          if(result.prices['2044120']!==42.82) throw new Error('Materialklassrabatt räknas fel: '+result.prices['2044120']);
          if(result.prices['0445707']!==22.42) throw new Error('Half-even 22,425 ska bli 22,42: '+result.prices['0445707']);
          if(result.prices['0030960']!==29.04) throw new Error('Half-even 29,045 ska bli 29,04: '+result.prices['0030960']);
          if(result.prices['0000220']!==99) throw new Error('Pris på E-nummer med ledande nollor räknas fel');
          if(LiRoPrice.resolveByArt('220')!==null) {
            // resolveByArt använder det importerade lokala registret, inte testresultatobjektet.
          }
          if(result.prices['9999999']!==12.34) throw new Error('Explicit nettopris prioriteras inte: '+result.prices['9999999']);
          if(result.prices['8888888']!==45.67) throw new Error('0 % rabatt ska ge beräkningsgrund/GNP: '+result.prices['8888888']);
          if(result.missingBase!==1 || !result.missingArticles.includes('0602020')) throw new Error('Rader utan prisgrund redovisas inte korrekt');

          localStorage.setItem('lirogo_price_overrides',JSON.stringify({'7777777':999}));
          const unknown=effectivePrice(['7777777',138,'M','UNKNOWN']);
          if(unknown!==null) throw new Error('Manuell prispatch får inte användas som Ahlsell-pris: '+unknown);

          const sw=fs.readFileSync('sw.js','utf8');
          if(!sw.includes("const CACHE = 'lirogo-v124'")) throw new Error('PWA-cache är inte uppdaterad till v124');
          if(!sw.includes("'./price-engine-v105.js'")) throw new Error('Prisengine ska finnas i precache');

          const source=fs.readFileSync('price-engine-v105.js','utf8');
          if(!source.includes('data-ahlsell-file="base"') || !source.includes('data-ahlsell-file="agreement"')) throw new Error('Ahlsell-importens filval saknas');
          if(!source.includes('Filerna behandlas lokalt på denna enhet')) throw new Error('Integritetsinformationen saknas');
          if(source.includes('MANUAL_KEY') || source.includes('AHLSSELL_EXPLICIT') || source.includes("'2044120':42.82")) throw new Error('Manuella eller hårdkodade kundpriser får inte finnas i prisengine');

          const quick=fs.readFileSync('quickflow-v103.js','utf8');
          const html=fs.readFileSync('index.html','utf8');
          if(!html.includes('src="./price-engine-v105.js"')) throw new Error('Prisengine laddas inte direkt av index.html');
          if(quick.includes('price-engine-v105.js?v=115') || quick.includes('_liroPriceEngineLoaderV115')) throw new Error('Legacy dynamisk prisloader finns kvar');
          if(quick.includes('_liroVerifiedPriceSourceV104') || quick.includes('lirogo_verified_net_prices_2026_10_05')) throw new Error('Legacy-prispatch finns kvar och kan blockera avtalspriser');

          const barcode=fs.readFileSync('barcode-v96.js','utf8');
          if(!barcode.includes('barcodeCandidatesV110') || !barcode.includes("compact.slice(0,-1)")) throw new Error('Streckkod 1500136E normaliseras inte till E-nummer');

          console.log('Prisregression OK', {version:LiRoPrice.version,source:LiRoPrice.source,classPrice:result.prices['2044120'],leadingZero:result.prices['0000220'],missingBase:result.missingBase});
          NODE