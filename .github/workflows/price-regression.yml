name: Material price regression

on:
  push:
    branches: [main]
    paths:
      - 'price-engine-v105.js'
      - 'quickflow-v103.js'
      - 'barcode-v96.js'
      - 'sw.js'
      - '.github/workflows/price-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'price-engine-v105.js'
      - 'quickflow-v103.js'
      - 'barcode-v96.js'
      - 'sw.js'
      - '.github/workflows/price-regression.yml'
  workflow_dispatch:

jobs:
  price-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Ahlsell price calculation and barcode normalization
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const store={};
          global.window=global;
          global.localStorage={
            getItem:k=>Object.prototype.hasOwnProperty.call(store,k)?store[k]:null,
            setItem:(k,v)=>{store[k]=String(v)}
          };
          global.document={addEventListener(){},querySelector(){return null}};
          global.setTimeout=()=>{};
          global.alert=()=>{};
          global.render=()=>true;
          vm.runInThisContext(fs.readFileSync('price-engine-v105.js','utf8'));

          if(!global.LiRoPrice || LiRoPrice.version!==114) throw new Error('Prisengine är inte v114');

          const agreementLine=({art='',cls='',discount=0,specific=0,net=0}) =>
            '  '+'N'+'0000000'+String(art).padEnd(20,' ')+String(cls).padEnd(6,' ')+
            String(discount).padStart(4,'0')+String(specific).padStart(4,'0')+
            String(net).padStart(9,'0')+'0000'+' '.repeat(30)+'261231';
          const baseLine=({art,gnp,cls}) =>
            String(art).padEnd(20,' ')+String(gnp).padStart(12,'0')+String(cls).padEnd(6,' ')+'ST '+' TEST';

          const agreement=[
            agreementLine({cls:'QL0700',discount:649}),
            agreementLine({art:'9999999',net:1234})
          ].join('\n');
          const base=[
            baseLine({art:'2044120',gnp:12200,cls:'QL0700'}),
            baseLine({art:'9999999',gnp:99999,cls:'QL0700'})
          ].join('\n');

          const parsed=LiRoPrice.parseAgreement(agreement);
          const result=LiRoPrice.calculateFromBase(base,parsed);
          if(result.prices['2044120']!==42.82) throw new Error('Materialklassrabatt räknas fel: '+result.prices['2044120']);
          if(result.prices['9999999']!==12.34) throw new Error('Explicit nettopris prioriteras inte: '+result.prices['9999999']);

          const unknown=effectivePrice(['8888888',138,'M','UNKNOWN']);
          if(unknown!==null) throw new Error('Okänd artikel föll tillbaka till katalog/listpris: '+unknown);

          const sw=fs.readFileSync('sw.js','utf8');
          if(!sw.includes("const CACHE = 'lirogo-v114'")) throw new Error('PWA-cache är inte uppdaterad till v114');
          if(sw.includes("'./price-engine-v105.js'")) throw new Error('Prisengine ska inte ligga i precache');

          const source=fs.readFileSync('price-engine-v105.js','utf8');
          if(!source.includes('data-ahlsell-file="base"') || !source.includes('data-ahlsell-file="agreement"')) throw new Error('Ahlsell-importens filval saknas');
          if(!source.includes('Kundavtalet laddas inte upp till GitHub')) throw new Error('Integritetsinformationen saknas');

          const barcode=fs.readFileSync('barcode-v96.js','utf8');
          if(!barcode.includes('barcodeCandidatesV110') || !barcode.includes("compact.slice(0,-1)")) throw new Error('Streckkod 1500136E normaliseras inte till E-nummer');

          console.log('Prisregression OK', {version:LiRoPrice.version,classPrice:result.prices['2044120'],explicit:result.prices['9999999']});
          NODE