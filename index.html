<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LiRo GO">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,300;0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
<title>LiRo GO</title>
<style>
:root{
  --bg:#000000; --surface:#121212; --surface2:#1a1a1a; --text:#f2f2f2; --muted:#8c8c8c;
  --accent:#ffc21a; --ink:#000000; --line:#242424;
  --pri-normal:#3dbe6b; --pri-high:#ff9a3d; --pri-urgent:#ff4d4d;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Barlow',-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:400;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:110px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.98)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid transparent;border-radius:12px;padding:13px 14px;width:100%;min-height:44px}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:88px;resize:vertical}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;display:block}

/* ---- generic layout helpers ---- */
.px{padding-left:16px;padding-right:16px}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.gap-xs{gap:8px} .gap-sm{gap:12px} .gap-md{gap:16px}
.muted{color:var(--muted)}
.accent{color:var(--accent)}
.bold{font-weight:600}
.card{background:var(--surface);border-radius:20px;padding:16px}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:0 0 44px}
.iconbtn.filled{background:var(--accent);color:var(--ink)}
.pill{padding:4px 12px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:500;color:var(--muted)}
.pill.on{background:var(--accent);color:var(--ink)}
.pill.quote{background:transparent;border:1px solid var(--pri-high);color:var(--pri-high)}
.dot{width:8px;height:8px;border-radius:50%}
.primary-btn{min-height:44px;border-radius:20px;background:var(--accent);color:var(--ink);font-weight:600;padding:0 24px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.primary-btn[disabled]{opacity:.4;pointer-events:none}
.h1{font-size:24px;font-weight:600;margin:0}
.h2{font-size:18px;font-weight:600;margin:0}
.label{font-size:13px;font-weight:500;color:var(--muted);display:block;margin-bottom:6px}

/* ---- opening screen ---- */
.opening{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;transition:opacity .25s ease-out}
.opening.fade{opacity:0;pointer-events:none}
.opening .mark{display:flex;flex-direction:column;align-items:center;gap:16px}
.opening .footer{position:absolute;bottom:48px;color:var(--muted);font-size:12px}
.open-logo{width:140px;height:auto;filter:brightness(1)}
.open-logo.flash{animation:openFlash .45s ease-out}
@keyframes openFlash{0%{filter:brightness(1)}35%{filter:brightness(2.4) drop-shadow(0 0 24px var(--accent))}100%{filter:brightness(1)}}
.reduced .open-logo{mask-image:none;-webkit-mask-image:none}

/* ---- home ---- */
.home-header{padding:16px 16px 0}
.brand-mini{height:26px;width:auto;display:block}
.greeting{padding:24px 16px 0}
.greeting .date{font-size:12px;color:var(--muted);margin-bottom:2px}
.idag{margin-top:32px}
.idag-head{padding:0 16px;margin-bottom:12px}
.steps{display:flex;gap:8px;width:80px}
.steps .dash{height:4px;flex:1;border-radius:999px;background:var(--surface2)}
.steps .dash.on{background:var(--accent)}
.cards{display:flex;gap:16px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.cards::-webkit-scrollbar{display:none}
.jobcard{scroll-snap-align:start;flex:0 0 calc(100% - 48px);min-height:1px}
.jobcard .top{margin-bottom:16px}
.jobcard .name-row{gap:12px;margin-bottom:16px}
.jobcard .icon-circle{width:44px;height:44px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:0 0 44px}
.jobcard .addr{gap:8px;margin-bottom:16px;color:var(--muted)}
.jobcard .foot{margin-top:4px}
.empty{padding:0 16px;color:var(--muted)}
.home-footer{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(0,0,0,0),var(--bg) 30%);display:flex;gap:12px;align-items:center}

/* ---- wizard ---- */
.wiz-header{padding:16px 16px 0}
.wiz-title{flex:1;text-align:center;font-size:18px;font-weight:600}
.wiz-steps{padding:0 16px;margin-top:16px}
.wiz-steps .row{gap:8px}
.wiz-steps .dash{height:4px;flex:1;border-radius:999px;background:var(--surface2)}
.wiz-steps .dash.on{background:var(--accent)}
.wiz-body{padding:20px 16px 100px}
.tile{min-height:44px;border-radius:20px;background:var(--surface);border:1px solid transparent;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;width:100%}
.tile.on{border-color:var(--accent)}
.tile.off{opacity:.4;pointer-events:none}
.tile.row-tile{flex-direction:row;justify-content:flex-start;text-align:left;padding:16px;gap:12px}
.tile.row-tile .t-text{flex:1}
.tile .t-sub{font-size:12px;color:var(--muted)}
.kind-row,.pri-row{display:flex;gap:12px}
.kind-row .tile,.pri-row .tile{flex:1}
.method-list{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.field{margin-bottom:16px}
.field-row{display:flex;gap:16px}
.field-row>*{flex:1}
.switch-row{display:flex;align-items:center;justify-content:space-between}
.switch{position:relative;width:46px;height:28px;border-radius:999px;background:var(--surface2);flex:0 0 46px}
.switch.on{background:var(--accent)}
.switch .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--text);transition:left .15s}
.switch.on .knob{left:21px;background:var(--ink)}
.desc-wrap{position:relative}
.desc-wrap .mic-btn{position:absolute;right:8px;bottom:8px}
.search-wrap{position:relative}
.search-wrap svg.i{position:absolute;left:14px;top:38px;color:var(--muted)}
.search-wrap input{padding-left:40px}
.divider{text-align:center;color:var(--muted);font-size:13px;margin:16px 0}
.result-row{padding:10px 0;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.result-row:last-child{border-bottom:0}
.selected-customer{display:flex;flex-direction:column;gap:16px}
.wiz-footer{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg);display:flex;flex-direction:column;gap:8px}
.missing{font-size:12px;color:var(--muted)}
.summary-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.summary-row .v{text-align:right}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
/* ---- job detail ---- */
.job-body{padding:16px 16px 100px}
.section{margin-top:28px}
.section-title{font-size:18px;font-weight:600;margin-bottom:12px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--surface)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-thumb .del{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
.photo-thumb .del svg{width:14px;height:14px}
.photo-add{aspect-ratio:1;border-radius:14px;background:var(--surface);border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:12px}
.photo-add input{display:none}
.photo-comment-card{margin-top:8px}
.photo-comment-card img{width:100%;border-radius:14px;margin-bottom:10px;max-height:220px;object-fit:cover}
.actions-row{display:flex;gap:12px}
.actions-row .tile{flex:1}
.material-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.material-row:last-of-type{border-bottom:0}
.material-info{flex:1;min-width:0}
.material-name{font-weight:600;font-size:15px}
.material-sub{font-size:12px;color:var(--muted);margin-top:2px}
.material-cols{display:flex;gap:16px;text-align:right;font-size:13px}
.material-cols .lbl{color:var(--muted);font-size:11px}
.material-del{flex:0 0 32px;width:32px;height:32px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.summary-card{background:var(--surface);border-radius:20px;padding:16px;margin-top:12px}
.summary-total{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.add-form{background:var(--surface);border-radius:20px;padding:16px;margin-top:12px;display:flex;flex-direction:column;gap:12px}
.add-form .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mic-inline{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px}
.field-mic{position:relative}
.field-mic input,.field-mic textarea{padding-right:44px}

/* ---- registrera material (panel) ---- */
.mat-panel{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.mat-panel-head{padding:16px;flex:0 0 auto}
.mat-panel-title{display:flex;align-items:center;justify-content:space-between}
.mat-panel-title h1{font-size:22px;font-weight:700;margin:0}
.mat-panel-sub{color:var(--muted);font-size:13px;margin-top:2px}
.mat-search{position:relative;margin-top:14px}
.mat-search svg.i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.mat-search input{padding-left:40px;padding-right:40px}
.mat-search .barcode-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px}
.mat-tabs{display:flex;gap:8px;margin-top:14px}
.mat-tab{padding:8px 14px;border-radius:999px;background:var(--surface);color:var(--muted);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.mat-tab.on{background:var(--accent);color:var(--ink)}
.mat-panel-list{flex:1;overflow-y:auto;padding:4px 16px 16px}
.mat-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.mat-item:last-child{border-bottom:0}
.mat-item-thumb{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:0 0 44px}
.mat-item-info{flex:1;min-width:0}
.mat-item-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat-item-sub{color:var(--muted);font-size:12px;margin-top:2px}
.mat-fav{flex:0 0 32px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.mat-fav.on{color:var(--accent)}
.mat-fav svg{width:18px;height:18px}
.stepper{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.stepper button{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.stepper button svg{width:14px;height:14px}
.stepper .qty{min-width:18px;text-align:center;font-weight:700;font-size:15px}
.snabbval{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));flex:0 0 auto;border-top:1px solid var(--line)}
.snabbval button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:var(--surface);font-size:12px;color:var(--text);text-align:center}
.snabbval button svg{width:20px;height:20px;color:var(--accent)}
.snabbval.cols4{grid-template-columns:repeat(4,1fr)}
.ai-suggest-box{background:var(--surface);border-radius:20px;padding:14px;margin-bottom:12px}
.ai-suggest-box textarea{min-height:60px}

/* ---- inställningar (panel) ---- */
.settings-body{flex:1;overflow-y:auto;padding:4px 16px 24px}
.settings-note{font-size:13px;color:var(--muted);line-height:1.5}
.settings-note a{color:var(--accent)}
.model-choice{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.model-opt{display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:14px;background:var(--surface);border:1px solid transparent}
.model-opt.on{border-color:var(--accent)}
#status{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;color:var(--ink);background:var(--text);border-radius:999px;padding:6px 14px;pointer-events:none;transition:opacity .3s;opacity:0;z-index:60}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="status"></div>
<div id="app"><p class="empty">Startar…</p></div>
<script>
/* ================= Ikoner ================= */
const ICON = {
  bolt:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M13 7l-4 6h3l-1 4 4-6h-3z" fill="currentColor" stroke="none"/></svg>',
  sync:'<span class="dot" style="background:#3dbe6b;display:inline-block"></span>',
  clock:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
  pin:'<svg class="i" viewBox="0 0 24 24"><path d="M12 21s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.3"/></svg>',
  wrench:'<svg class="i" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2-2z"/></svg>',
  zap:'<svg class="i" viewBox="0 0 24 24"><path d="M13 3 4 14h6l-1 7 9-11h-6z"/></svg>',
  gauge:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 12l4-4M8 14a4 4 0 0 1 8 0"/></svg>',
  panel:'<svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 4v16"/></svg>',
  battery:'<svg class="i" viewBox="0 0 24 24"><rect x="2" y="8" width="16" height="8" rx="2"/><path d="M18 10.5h2a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1h-2"/><path d="M9 10l-2 3h3l-2 3"/></svg>',
  bulb:'<svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.5.4.8 1 .8 1.6V16h5.4v-.5c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3z"/></svg>',
  chevronLeft:'<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  x:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  mic:'<svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  menu:'<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  search:'<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  calendar:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  keyboard:'<svg class="i" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h12"/></svg>',
  camera:'<svg class="i" viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  arrowRight:'<svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  user:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>',
  trash:'<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>',
  box:'<svg class="i" viewBox="0 0 24 24"><path d="M3 8l9-5 9 5-9 5-9-5zM3 8v9l9 5M21 8v9l-9 5M12 13v9"/></svg>',
  cart:'<svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M3 4h2l2.2 11h11.1L21 8H6.4"/></svg>',
  calc:'<svg class="i" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg>',
  save:'<svg class="i" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  starFill:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  barcode:'<svg class="i" viewBox="0 0 24 24"><path d="M4 5v14M8 5v14M11 5v14M15 5v14M18 5v14M21 5v14" stroke-width="1.4"/></svg>',
  minus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  plusSmall:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  sparkle:'<svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>'
};

/* ================= Data ================= */
const WORK_TYPES = [
  {v:'service', l:'Service/felsökning', i:'wrench'},
  {v:'new_install', l:'Nyinstallation', i:'zap'},
  {v:'measurement', l:'Mätteknik', i:'gauge'},
  {v:'switchboard', l:'Elcentral', i:'panel'},
  {v:'charging', l:'Laddbox', i:'battery'},
  {v:'lighting', l:'Belysning', i:'bulb'}
];
const WORK_TYPE_LABEL = Object.fromEntries(WORK_TYPES.map(w=>[w.v,w.l]));
const PRIORITIES = [{v:'normal',l:'Normal'},{v:'high',l:'Hög'},{v:'urgent',l:'Akut'}];
const PRIORITY_LABEL = {normal:'Normal',high:'Hög',urgent:'Akut'};
const PRIORITY_COLOR = {normal:'var(--pri-normal)',high:'var(--pri-high)',urgent:'var(--pri-urgent)'};

/* ================= Lagring (IndexedDB) ================= */
let DB, customers=[], jobs=[];
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('lirogo',2);
    r.onupgradeneeded=()=>{
      const d=r.result;
      if(!d.objectStoreNames.contains('customers')) d.createObjectStore('customers',{keyPath:'id'});
      if(!d.objectStoreNames.contains('jobs')) d.createObjectStore('jobs',{keyPath:'id'});
      if(!d.objectStoreNames.contains('photos')) d.createObjectStore('photos',{keyPath:'id'}).createIndex('job','jobId');
      if(!d.objectStoreNames.contains('materials')) d.createObjectStore('materials',{keyPath:'id'}).createIndex('job','jobId');
    };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function tx(store,mode,fn){
  return new Promise((res,rej)=>{ const t=DB.transaction(store,mode); const q=fn(t.objectStore(store)); t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); });
}

const dbAll=s=>tx(s,'readonly',o=>o.getAll());
const dbDel=(s,k)=>tx(s,'readwrite',o=>o.delete(k));

let catalog = null, catalogLoading = false;
async function ensureCatalog(){
  if(catalog || catalogLoading) return catalog;
  catalogLoading = true;
  try{
    const res = await fetch('katalog-el.json');
    catalog = await res.json();
  }catch(err){
    console.error('Kunde inte ladda prislistan', err);
    catalog = [];
  }
  catalogLoading = false;
  return catalog;
}
function searchCatalog(query, limit){
  if(!catalog || !query || query.trim().length < 2) return [];
  const q = query.trim().toUpperCase();
  const out = [];
  for(let i=0; i<catalog.length && out.length<limit; i++){
    const row = catalog[i];
    if(row[0].startsWith(q) || row[3].toUpperCase().includes(q)) out.push(row);
  }
  return out;
}

async function bumpMaterialQty(jobId, row, delta){
  const existing = jobMaterials.find(m=>m.eNr===row[0]);
  if(existing){
    const newQty = (Number(existing.qty)||0) + delta;
    if(newQty <= 0){
      await deleteMaterial(existing.id);
      jobMaterials = jobMaterials.filter(m=>m.id!==existing.id);
      return 0;
    }
    existing.qty = newQty;
    await dbPut('materials', existing);
    return newQty;
  } else if(delta > 0){
    const m = await addMaterial(jobId, { name: row[3], eNr: row[0], unit: row[2], unitPrice: row[1], qty: delta });
    jobMaterials.push(m);
    return delta;
  }
  return 0;
}

/* ---- AI-förslag (Claude API, egen nyckel, direkt från webbläsaren) ---- */
const AI_MODEL_DEFAULT = 'claude-haiku-4-5';
function getAiKey(){ return localStorage.getItem('lirogo_ai_key') || ''; }
function setAiKey(k){ if(k) localStorage.setItem('lirogo_ai_key', k); else localStorage.removeItem('lirogo_ai_key'); }
function getAiModel(){ return localStorage.getItem('lirogo_ai_model') || AI_MODEL_DEFAULT; }
function setAiModel(m){ localStorage.setItem('lirogo_ai_model', m); }

async function fetchAiSuggestions(description){
  const key = getAiKey();
  if(!key) throw new Error('no-key');
  const system = 'Du är en erfaren svensk elektriker. Utifrån en kort beskrivning av ett arbete, lista 5-10 typiska elmaterial-komponenter som troligen behövs. Svara ENDAST med en JSON-array av korta svenska produktbeskrivningar (utan priser eller artikelnummer), t.ex. ["Automatsäkring 10A 1-pol","Jordfelsbrytare 25A 30mA","Kabelkanal 40x25mm"]. Inget annat i svaret, ingen förklaringstext.';
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01'
    },
    body: JSON.stringify({
      model: getAiModel(),
      max_tokens: 1024,
      system,
      messages: [{ role:'user', content: description }]
    })
  });
  if(!res.ok){
    let msg = 'API-fel ('+res.status+')';
    if(res.status===401) msg = 'Ogiltig API-nyckel';
    else if(res.status===429) msg = 'För många förfrågningar, försök igen om en stund';
    throw new Error(msg);
  }
  const data = await res.json();
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  const text = textBlock ? textBlock.text : '';
  const match = text.match(/\[[\s\S]*\]/);
  if(!match) return [];
  try{ const arr = JSON.parse(match[0]); return Array.isArray(arr) ? arr.filter(x=>typeof x==='string') : []; }
  catch{ return []; }
}

/* Matchar AI:ns fria textförslag ("Automatsäkring 10A 1-pol") mot riktiga
   rader i Ahlsell-katalogen. Katalognamnen är korta/förkortade, så vi söker
   på det mest utmärkande ordet i förslaget (oftast produkttypen, först i
   frasen) istället för hela frasen ordagrant. */
function keywordFor(suggestion){
  const words = suggestion.split(/\s+/).filter(w=>w.replace(/[^A-ZÅÄÖa-zåäö]/g,'').length>=4);
  if(!words.length) return suggestion;
  return words.reduce((a,b)=> b.length>a.length ? b : a, words[0]);
}
function matchSuggestionsToCatalog(suggestions){
  const matched = [];
  const seen = new Set();
  for(const s of suggestions){
    const kw = keywordFor(s);
    const hits = searchCatalog(kw, 3);
    if(hits.length && !seen.has(hits[0][0])){ seen.add(hits[0][0]); matched.push(hits[0]); }
  }
  return matched;
}

function greeting(){ const h=new Date().getHours(); if(h<10) return 'God morgon'; if(h<17) return 'Hej'; return 'God kväll'; }
function formatDate(){
  const days=['söndag','måndag','tisdag','onsdag','torsdag','fredag','lördag'];
  const months=['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
  const n=new Date(); return `${days[n.getDay()]} ${n.getDate()} ${months[n.getMonth()]}`;
}
function fmtTimeRange(plannedAt){
  if(!plannedAt) return 'Ingen tid vald';
  const s=new Date(plannedAt), e=new Date(s.getTime()+4*3600000);
  const f=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return `${f(s)} – ${f(e)}`;
}
function fmtDateTime(plannedAt){
  if(!plannedAt) return 'Ingen tid vald';
  const days=['sön','mån','tis','ons','tors','fre','lör'];
  const d=new Date(plannedAt);
  const day=String(d.getDate()).padStart(2,'0'), month=String(d.getMonth()+1).padStart(2,'0');
  const time=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return `${days[d.getDay()]} ${day}/${month} ${time}`;
}
function statusLabel(status){
  if(status==='ongoing') return {l:'Pågår', on:true};
  if(status==='tomorrow') return {l:'Imorgon', on:false};
  if(status==='done') return {l:'Klart', on:false};
  return {l:'Senare', on:false};
}

function afterOpening(){
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const el = document.getElementById('opening');
  const img = document.getElementById('openLogo');
  const RING_MS = 900, BOLT_MS = 450, HOLD_MS = 150;

  const finish = () => {
    el.classList.add('fade');
    setTimeout(()=>{ st={view:'home'}; render(); }, reduced?0:250);
  };

  if(reduced){
    img.style.maskImage = 'none'; img.style.webkitMaskImage = 'none';
    img.classList.add('flash');
    finish();
    return;
  }

  // "Bågen laddas upp runt O:et": a clock-wipe reveal of the logo, like a charging ring.
  const start = performance.now();
  function frame(now){
    const t = Math.min(1, (now - start) / RING_MS);
    const deg = t * 360;
    const mask = `conic-gradient(from -90deg, #000 ${deg}deg, transparent ${deg}deg)`;
    img.style.webkitMaskImage = mask;
    img.style.maskImage = mask;
    if(t < 1) requestAnimationFrame(frame);
    else {
      img.style.maskImage = 'none'; img.style.webkitMaskImage = 'none';
      img.classList.add('flash'); // "sedan tänds blixten"
    }
  }
  requestAnimationFrame(frame);
  setTimeout(finish, RING_MS + BOLT_MS + HOLD_MS);
}

let jobPhotos=[], jobMaterials=[], photoObjectUrls={};
async function loadJobDetail(id){
  jobPhotos = await dbByJob('photos', id);
  jobMaterials = await dbByJob('materials', id);
  Object.values(photoObjectUrls).forEach(u=>URL.revokeObjectURL(u));
  photoObjectUrls = {};
  jobPhotos.forEach(p=>{ photoObjectUrls[p.id] = URL.createObjectURL(p.blob); });
}
function materialTotals(job){
  const cost = jobMaterials.reduce((sum,m)=>sum + (Number(m.qty)||0) * (Number(m.unitPrice)||0), 0);
  const markup = job.markupPercent ?? 15;
  const markupSum = cost * (markup/100);
  return { cost, markup, markupSum, total: cost + markupSum };
}
function fmtKr(n){ return Math.round(n).toLocaleString('sv-SE') + ' kr'; }

let settingsOpen = false;
function render(){
  if(st.view==='opening'){ $app.innerHTML = vOpening(); afterOpening(); return; }
  if(st.view==='home'){ $app.innerHTML = vHome() + (settingsOpen?vSettingsPanel():''); afterHome(); return; }
  if(st.view==='wizard'){

  const t=e.target; const f=t.dataset.field; if(!f) return;
  if(f==='search'){
    searchQuery=t.value;
    const existing = draft.existingCustomerId ? customers.find(c=>c.id===draft.existingCustomerId) : null;
    const results = (!existing && searchQuery.trim()) ? customers.filter(c=>c.name.toLowerCase().includes(searchQuery.trim().toLowerCase())).slice(0,20) : [];
    const box = document.getElementById('searchResults');
    if(box) box.innerHTML = vSearchResults(results);
    return;
  }
  if(f.startsWith('nc.')){ draft.newCustomer[f.slice(3)]=t.value; if(f==='nc.name'||f==='nc.address') patchWizFooter(); return; }
  if(f==='title'){ draft.title=t.value; patchWizFooter(); return; }
  if(f==='description'){ draft.description=t.value; return; }
  if(f==='plannedDate'){ draft.plannedDate=t.value; return; }
  if(f==='plannedTime'){ draft.plannedTime=t.value; return; }

  if(f==='photo-comment'){ updatePhotoComment(t.dataset.id, t.value); return; }
  if(f==='mat-name'){ st.matDraft=st.matDraft||{}; st.matDraft.name=t.value; return; }
  if(f==='mat-enr'){ st.matDraft=st.matDraft||{}; st.matDraft.eNr=t.value; return; }
  if(f==='mat-qty'){ st.matDraft=st.matDraft||{}; st.matDraft.qty=t.value; return; }
  if(f==='mat-price'){ st.matDraft=st.matDraft||{}; st.matDraft.unitPrice=t.value; return; }
  if(f==='mat-search'){
    st.matSearch = t.value;
    const box=document.getElementById('matPanelList'); if(box) box.innerHTML=vMatPanelList();
    return;
  }
  if(f==='markup'){
    const job=jobById(st.id); if(!job) return;
    const percent = Number(t.value)||0;
    job.markupPercent=percent;
    setJobMarkup(st.id, percent);
    const totals = materialTotals(job);
    const totalEl = $app.querySelector('.summary-total span:last-child');
    if(totalEl) totalEl.textContent = fmtKr(totals.total);
    $app.querySelectorAll('.summary-card .row.between').forEach(row=>{
      const label = row.querySelector('.accent');
      if(label && label.textContent==='Du tjänar'){ row.querySelector('span:last-child').textContent = fmtKr(totals.markupSum); }
    });
    $app.querySelectorAll('.material-row').forEach(rowEl=>{
      const myPrice = Number(rowEl.dataset.myprice)||0;
      const markupAmt = myPrice * (percent/100);
      const customerPrice = myPrice + markupAmt;
      const mEl = rowEl.querySelector('.mat-markup-val');
      const cEl = rowEl.querySelector('.mat-customer-val');
      if(mEl) mEl.textContent = fmtKr(markupAmt);
      if(cEl) cEl.textContent = fmtKr(customerPrice);
    });
    return;
  }
  if(f==='ai-key'){ setAiKey(t.value.trim()); return; }
  if(f==='ai-desc'){ st.aiDesc = t.value; return; }
});

$app.addEventListener('change', async e=>{
  const t=e.target;
  if(t.dataset.photoInput && t.files && t.files[0]){
    const file = t.files[0];
    t.value='';
    const p = await addPhoto(st.id, file, '');
    jobPhotos.push(p);
    photoObjectUrls[p.id] = URL.createObjectURL(file);
    flash('Foto sparat'); render();
  }
});

// Updates only the Nästa-button's disabled state and the missing-fields hint,
// without touching the inputs above (which would drop focus mid-keystroke).
function patchWizFooter(){
  const footer = $app.querySelector('.wiz-footer'); if(!footer) return;
  const btn = footer.querySelector('.primary-btn');
  const missing = st.step===1 ? customerMissing() : st.step===2 ? detailsMissing() : [];
  let hint = footer.querySelector('.missing');
  if(missing.length){
    if(!hint){ hint = document.createElement('span'); hint.className='missing'; footer.insertBefore(hint, btn); }
    hint.textContent = `Saknas: ${missing.join(', ')}`;
    btn.setAttribute('disabled','');
  } else {
    if(hint) hint.remove();
    btn.removeAttribute('disabled');
  }
}

$app.addEventListener('click', async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;

  if(a==='new-job'){ draft=emptyDraft(); searchQuery=''; st={view:'wizard', step:0}; return render(); }
  if(a==='open-job'){
    const id=b.dataset.id; await loadJobDetail(id);
    st={view:'job', id}; return render();
  }
  if(a==='job-back'){ st={view:'home'}; return render(); }

  if(a==='wiz-back'){
    if(st.step===0){ st={view:'home'}; return render(); }
    st.step -= 1; return render();
  }
  if(a==='wiz-goto'){ st.step = +b.dataset.step; return render(); }
  if(a==='wiz-next'){ st.step += 1; return render(); }

  if(a==='set-kind'){ draft.kind=b.dataset.kind; return render(); }
  if(a==='set-method'){
    if(!draft.kind) return;
    draft.method=b.dataset.method;
    if(b.dataset.method==='manual'){ st.step=1; return render(); }
    return render();
  }
  if(a==='clear-existing'){ draft.existingCustomerId=null; searchQuery=''; return render(); }
  if(a==='pick-customer'){ draft.existingCustomerId=b.dataset.id; searchQuery=''; return render(); }
  if(a==='toggle-save-contact'){ draft.newCustomer.saveAsContact=!draft.newCustomer.saveAsContact; return render(); }
  if(a==='toggle-company'){ draft.newCustomer.isCompany=!draft.newCustomer.isCompany; return render(); }
  if(a==='set-worktype'){ draft.workType=b.dataset.v; return render(); }
  if(a==='set-priority'){ draft.priority=b.dataset.v; return render(); }
  if(a==='toggle-quote'){ draft.isQuote=!draft.isQuote; return render(); }

  if(a==='wiz-submit'){
    let customerId = draft.existingCustomerId;
    if(!customerId){
      const c = await createCustomer({
        name: draft.newCustomer.name.trim(), phone: draft.newCustomer.phone.trim()||null,
        email: draft.newCustomer.email.trim()||null, address: draft.newCustomer.address.trim()||null,
        postalCode: draft.newCustomer.postalCode.trim()||null, city: draft.newCustomer.city.trim()||null,
        saveAsContact: draft.newCustomer.saveAsContact,
        isCompany: draft.newCustomer.isCompany, orgNumber: draft.newCustomer.orgNumber.trim()||null,
        invoiceAddress: draft.newCustomer.invoiceAddress.trim()||null,
        invoicePostalCode: draft.newCustomer.invoicePostalCode.trim()||null,
        invoiceCity: draft.newCustomer.invoiceCity.trim()||null,
        invoiceReference: draft.newCustomer.invoiceReference.trim()||null,
        glnNumber: draft.newCustomer.glnNumber.trim()||null
      });
      customerId = c.id;
    }
    const job = await createJob({
      customerId, kind: draft.kind||'customer_job', title: draft.title.trim(), workType: draft.workType,
      description: draft.description.trim()||null, plannedAt: draftPlannedAt(), priority: draft.priority,
      isQuote: draft.isQuote
    });
    flash('Uppdrag skapat');
    await loadJobDetail(job.id);
    st={view:'job', id:job.id}; return render();
  }

  /* ---- foton ---- */
  if(a==='open-photo'){ st.openPhoto=b.dataset.id; return render(); }
  if(a==='close-photo'){ st.openPhoto=null; return render(); }
  if(a==='delete-photo'){
    await deletePhoto(b.dataset.id);
    URL.revokeObjectURL(photoObjectUrls[b.dataset.id]); delete photoObjectUrls[b.dataset.id];
    jobPhotos = jobPhotos.filter(p=>p.id!==b.dataset.id);
    st.openPhoto=null; flash('Foto borttaget'); return render();
  }

  /* ---- materiallista: registrera-panel ---- */
  if(a==='open-mat-panel'){
    st.matPanel=true; st.matPanelMode='browse'; st.matTab=st.matTab||'recent'; st.matSearch=''; st.matDraft={};
    render();
    if(!catalog){
      ensureCatalog().then(()=>{ if(st.matPanel){ const box=document.getElementById('matPanelList'); if(box) box.innerHTML=vMatPanelList(); } });
    }
    return;
  }
  if(a==='close-mat-panel'){ st.matPanel=false; return render(); }
  if(a==='set-mat-tab'){ st.matTab=b.dataset.tab; st.matSearch=''; return render(); }
  if(a==='switch-to-manual'){ st.matPanelMode='manual'; st.matDraft=st.matDraft||{}; return render(); }
  if(a==='switch-to-ai'){
    if(!getAiKey()){ settingsOpen=true; st.matPanel=false; flash('Lägg till en API-nyckel för AI-förslag'); return render(); }
    st.matPanelMode='ai'; st.aiMatches=null; st.aiError=null; return render();
  }
  if(a==='back-to-browse'){ st.matPanelMode='browse'; st.matDraft={}; return render(); }
  if(a==='ai-suggest'){
    const desc = (st.aiDesc||'').trim();
    if(!desc){ flash('Beskriv arbetet först'); return; }
    st.aiLoading=true; st.aiError=null; st.aiMatches=null; render();
    (async()=>{
      try{
        const suggestions = await fetchAiSuggestions(desc);
        st.aiMatches = matchSuggestionsToCatalog(suggestions);
      }catch(err){
        st.aiError = err.message==='no-key' ? 'Ingen API-nyckel inlagd'
          : err.message==='Failed to fetch' ? 'Kunde inte nå Anthropics API — kontrollera nätet'
          : (err.message||'Något gick fel');
      }
      st.aiLoading=false;
      render();
    })();
    return;
  }
  if(a==='dictate-ai'){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ flash('Diktering stöds inte i den här webbläsaren'); return; }
    const rec = new SR(); rec.lang='sv-SE'; rec.interimResults=false;
    rec.onresult = (ev)=>{ st.aiDesc = ev.results[0][0].transcript; render(); };
    rec.onerror = ()=>flash('Kunde inte tolka talet, försök igen');
    rec.start();
    return;
  }

  /* ---- inställningar ---- */
  if(a==='open-settings'){ settingsOpen=true; return render(); }
  if(a==='close-settings'){ settingsOpen=false; return render(); }
  if(a==='choose-model'){ setAiModel(b.dataset.model); return render(); }
  if(a==='clear-ai-key'){ setAiKey(''); flash('Nyckel borttagen'); return render(); }
  if(a==='toggle-fav'){ toggleFavoriteArtnr(b.dataset.artnr); return render(); }
  if(a==='bump-qty'){
    const row = catalogRow(b.dataset.artnr); if(!row) return;
    const delta = Number(b.dataset.delta);
    await bumpMaterialQty(st.id, row, delta);
    if(delta>0) pushRecentArtnr(row[0]);
    return render();
  }
  if(a==='scan-barcode'){
    const BD = window.BarcodeDetector;
    if(!BD){ flash('Streckkodsläsning stöds inte i den här webbläsaren'); return; }
    flash('Streckkodsläsning kommer snart');
    return;
  }
  if(a==='pick-catalog'){
    const row = catalogRow(b.dataset.artnr); if(!row) return;
    st.matDraft = { name: row[3], eNr: row[0], unit: row[2], unitPrice: row[1], qty: st.matDraft?.qty||'' };
    return render();
  }
  if(a==='cancel-material'){ st.matPanelMode='browse'; st.matDraft={}; return render(); }
  if(a==='save-material'){
    const d = st.matDraft||{};
    if(!d.name || !String(d.name).trim()){ flash('Ange ett namn på artikeln'); return; }
    const m = await addMaterial(st.id, { name:String(d.name).trim(), eNr:d.eNr||'', qty:Number(d.qty)||0, unit:d.unit||'st', unitPrice:Number(d.unitPrice)||0 });
    jobMaterials.push(m);
    st.matPanelMode='browse'; st.matDraft={};
    flash('Artikel tillagd'); return render();
  }
  if(a==='delete-material'){
    await deleteMaterial(b.dataset.id);
    jobMaterials = jobMaterials.filter(m=>m.id!==b.dataset.id);
    return render();
  }
  if(a==='save-materialplan'){ flash('Materialplan sparad'); return; }
  if(a==='dictate-material'){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ flash('Diktering stöds inte i den här webbläsaren – använd tangentbordets mikrofon'); return; }
    const rec = new SR(); rec.lang='sv-SE'; rec.interimResults=false;
    rec.onresult = (ev)=>{
      const text = ev.results[0][0].transcript;
      if(st.matPanelMode==='manual'){ st.matDraft = st.matDraft||{}; st.matDraft.name = text; }
      else { st.matSearch = text; }
      render();
    };
    rec.onerror = ()=>flash('Kunde inte tolka talet, försök igen');
    rec.start();
    return;
  }
});

(async function boot(){
  try{
    DB = await openDB();
    customers = await dbAll('customers');
    jobs = await dbAll('jobs');
    await seedDemoIfEmpty();
  }catch(err){ console.error('Kunde inte öppna lagring', err); }
  render();

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
